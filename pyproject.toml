[project]
name = "rmitguard"
version = "0.1.0"
description = "Team GenData — RMIT Hackathon 2026, Challenge 1: multilingual prompt-attack classification"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "tabulate>=0.9",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
# Heavy deps only needed to fine-tune locally; Kaggle images already ship them.
train = [
    "torch>=2.3",
    "transformers>=4.48",
    "datasets>=2.19",
    "accelerate>=0.30",
    "peft>=0.11",
    "bitsandbytes>=0.43; platform_system == 'Linux'",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pre-commit>=3.7",
    "kaggle>=1.7",
]

[project.scripts]
rmitguard = "rmitguard.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rmitguard"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests", "tools"]
extend-exclude = ["kaggle/build", "kaggle/ready"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "B905"]

[tool.ruff.lint.per-file-ignores]
"kaggle/*.py" = ["E402", "F821"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:The least populated class:UserWarning"]

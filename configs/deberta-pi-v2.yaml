# Already trained on (English) prompt injection; 2-class head is re-initialised to 3 classes.
# Watch the per-language table: the DeBERTa-v3 vocabulary is English-centric.
name: deberta-pi-v2
model: deberta-pi-v2
max_len: 512
head_len: 384
lr: 2.0e-5
epochs: 3
batch_size: 16
grad_accum: 1
class_weight: sqrt
